[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-lakehouse-copilot"
version = "0.1.0"
description = "MCP-Based Autonomous Data Lakehouse Copilot"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Mert Genç" }
]

dependencies = [
    # MCP
    "mcp>=1.2.0",

    # LLM & Agent Orchestration
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.40",
    "langgraph-checkpoint>=2.0.0",
    "openai>=1.50.0",

    # Data Engine
    "duckdb>=1.1.0",
    "polars>=1.12.0",
    "pyarrow>=17.0.0",
    "pandas>=2.2.0",

    # PostgreSQL
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.30",

    # Config
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",

    # CLI & Logging
    "rich>=13.9.0",
    "typer>=0.12.0",
    "structlog>=24.4.0",

    # Async
    "anyio>=4.6.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.10.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "SIM"]
ignore = ["S101", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: gerçek LLM/DB çağrısı yapan testler"
]