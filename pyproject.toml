[project]
name = "mcp-lakehouse-copilot"
version = "0.1.0"
description = "MCP-Based Autonomous Data Lakehouse Copilot"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "ASYNC", "S", "SIM"]
# E501 (line too long): `ruff format` kodu zaten sınırlıyor; yorumlar için gevşek.
# S101 (assert kullanımı): pytest testlerinde standart.
ignore = ["S101", "E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
files = ["src"]
explicit_package_bases = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: gerçek LLM/DB çağrısı yapan testler"]
